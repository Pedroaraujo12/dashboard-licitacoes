<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Licitações | AgSUS CCS-RD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #0b1120; color: white; }
        .sidebar-card { background-color: #1e293b; border-radius: 0.75rem; padding: 1.25rem; border: 1px solid #334155; }
        .indicator-label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .chart-container { background-color: #111827; border-radius: 1rem; padding: 1.5rem; height: 320px; position: relative; border: 1px solid #1f2937; }
        .filter-select { background-color: #1f2937; border: 1px solid #374151; border-radius: 0.5rem; padding: 0.4rem 0.6rem; font-size: 0.75rem; color: #e5e7eb; width: 100%; cursor: pointer; }
        .chart-title { font-size: 0.8rem; font-weight: 800; margin-bottom: 1.25rem; color: #facc15; text-transform: uppercase; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        .aging-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
        .aging-red { background-color: #ef4444; color: white; }
        .aging-yellow { background-color: #eab308; color: black; }
        .aging-green { background-color: #22c55e; color: white; }
    </style>
</head>
<body class="p-4 md:p-6 overflow-x-hidden min-h-screen">

    <header class="flex flex-col lg:flex-row justify-between items-center mb-8 px-4 gap-4 border-b border-slate-800 pb-6 text-white">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2.5 rounded-xl"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div>
            <h1 class="text-xl md:text-2xl font-black uppercase tracking-tight">Gestão de Prazos AgSUS CCS-RD • Licitações 2026</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.location.reload()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-700 transition">🔄 Recarregar Dados</button>
        </div>
    </header>

    <div class="flex flex-col xl:flex-row gap-8">
        <aside class="w-full xl:w-80 space-y-6">
            <div class="sidebar-card text-center"><p class="indicator-label">Total de Processos</p><p id="totalProcessos" class="text-5xl font-black text-white">0</p></div>
            <div class="sidebar-card bg-blue-900/20"><p class="indicator-label text-blue-400">Total Estimado</p><p id="vlrEstimadoTotal" class="text-2xl font-black text-white text-emerald-400">R$ 0,00</p></div>
            <div class="sidebar-card bg-red-900/20"><p class="indicator-label text-red-400">Processos em Atraso</p><p id="totalAtrasados" class="text-4xl font-black text-white">0</p></div>
        </aside>

        <main class="flex-1 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-900/40 p-6 rounded-2xl border border-slate-800 shadow-inner">
                <div class="space-y-1.5"><label class="indicator-label text-[9px]">Status de Prazo</label><select class="filter-select" id="f-prazo" onchange="applyFilters()"><option value="Todos">Todos</option><option value="Atrasados">Atrasados</option><option value="No Prazo">No Prazo</option></select></div>
                <div class="space-y-1.5"><label class="indicator-label text-[9px]">Demandante</label><select class="filter-select" id="f-demandante" onchange="applyFilters()"><option value="Todos">Todos</option></select></div>
                <div class="space-y-1.5"><label class="indicator-label text-[9px]">Modalidade</label><select class="filter-select" id="f-modalidade" onchange="applyFilters()"><option value="Todos">Todas</option></select></div>
                <div class="space-y-1.5"><label class="indicator-label text-[9px]">Fase Atual</label><select class="filter-select" id="f-fase" onchange="applyFilters()"><option value="Todos">Todas</option></select></div>
            </div>

            <div class="bg-slate-900/30 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center"><h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Fluxo de Execução</h3></div>
                <div class="overflow-x-hidden overflow-y-auto max-h-[600px]">
                    <table class="w-full text-left table-fixed">
                        <thead class="sticky top-0 bg-[#111827] z-10 shadow-sm"><tr class="text-[9px] font-black uppercase border-b border-slate-800 text-slate-500 tracking-tighter">
                            <th class="w-[18%] px-2 py-4">Processo</th>
                            <th class="w-[28%] px-2 py-4">Fase Atual</th>
                            <th class="w-[18%] px-2 py-4 text-center">Prazo Tarefa</th>
                            <th class="w-[18%] px-2 py-4 text-center">Entrega Final</th>
                            <th class="w-[18%] px-2 py-4 text-right">Vlr Estimado</th>
                        </tr></thead>
                        <tbody id="tableBody" class="divide-y divide-slate-800/40 text-slate-300"></tbody>
                    </table>
                </div>
            </div>

            <footer class="pt-8 flex flex-col md:flex-row justify-between text-slate-500 text-[10px] font-black uppercase tracking-wider gap-4">
                <span id="lastUpdate">Atualizado em: --/--/----</span>
            </footer>
        </main>
    </div>

    <div id="modalDetalhes" class="fixed inset-0 modal-overlay hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-[#1e293b] w-full max-w-2xl rounded-3xl border border-slate-700 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-blue-600 px-6 py-5 flex justify-between items-center text-white"><h2 class="text-lg font-black uppercase tracking-tighter">Cronograma do Processo</h2><button onclick="closeModal()" class="text-3xl leading-none">&times;</button></div>
            <div id="modalContent" class="p-8 grid grid-cols-2 gap-6 text-sm overflow-y-auto"></div>
            <div class="bg-slate-900/50 px-8 py-5 text-right"><button onclick="closeModal()" class="bg-slate-700 text-white px-8 py-3 rounded-xl font-black uppercase tracking-widest text-[10px]">Fechar</button></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let rawData = [];

        async function init() {
            const { data, error } = await sb.from('licitacoes').select('*');
            if (error) { console.error(error); return; }
            rawData = data || [];
            document.getElementById('lastUpdate').innerText = "Última Sincronização: " + new Date().toLocaleString('pt-br');
            populateFilters(rawData);
            updateView(rawData);
        }

        function populateFilters(data) {
            const getUnique = (key) => [...new Set(data.map(i => i[key]).filter(Boolean))].sort();
            const fill = (id, items) => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="Todos">Todos</option>';
                items.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; opt.innerText = v; el.appendChild(opt);
                });
            };
            fill('f-demandante', getUnique('demandante'));
            fill('f-modalidade', getUnique('modalidade'));
            fill('f-fase', getUnique('fase_atual'));
        }

        function cleanVal(v) { return parseFloat(v) || 0; }
        function formatBRL(v) { return cleanVal(v).toLocaleString('pt-br', {style:'currency', currency:'BRL'}); }
        function formatDate(d) { 
            if(!d || d === '-' || d === 'None') return '-';
            try { 
                if(d.includes('-')) {
                    const parts = d.split('-');
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                return d; 
            } catch(e) { return d; }
        }

        function extractMetaDates(obs) {
            const match = obs ? obs.match(/<!--METADATA_DATES:ATIV=(.*)\|FINAL=(.*)-->/) : null;
            if (match) {
                return { ativ: match[1], final: match[2], cleanObs: obs.replace(match[0], '') };
            }
            return { ativ: null, final: null, cleanObs: obs || '' };
        }

        function parseToISO(dateStr) {
            if (!dateStr || dateStr === '-' || dateStr === 'None') return null;
            if (dateStr.includes('-')) return dateStr;
            const parts = dateStr.split('/');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dateStr;
        }

        function getAging(dateStr) {
            const isoDate = parseToISO(dateStr);
            if (!isoDate) return { label: 'N/A', class: '' };
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(isoDate);
            if (isNaN(target)) return { label: dateStr, class: '' };
            const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return { label: `Atrasado ${Math.abs(diffDays)}d`, class: 'aging-red' };
            if (diffDays <= 2) return { label: `Vence em ${diffDays}d`, class: 'aging-yellow' };
            return { label: `No Prazo (${diffDays}d)`, class: 'aging-green' };
        }

        function valorPorExtenso(valor) {
            if (!valor || valor <= 0) return "";
            const unidades = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
            const dez_a_dezenove = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
            const dezenas = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
            const centenas = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];
            function converter_parte(n) {
                if (n === 0) return "";
                if (n === 100) return "cem";
                let c = Math.floor(n / 100), d = Math.floor((n % 100) / 10), u = n % 10, res = "";
                if (c > 0) res += centenas[c];
                if (d > 0 || u > 0) {
                    if (res !== "") res += " e ";
                    if (d === 1) res += dez_a_dezenove[u];
                    else { res += dezenas[d]; if (d > 0 && u > 0) res += " e "; res += unidades[u]; }
                }
                return res.trim();
            }
            let inteiro = Math.floor(valor), centavos = Math.round((valor - inteiro) * 100), partes = [];
            let milhoes = Math.floor(inteiro / 1000000), milhares = Math.floor((inteiro % 1000000) / 1000), resto = inteiro % 1000;
            if (milhoes > 0) partes.push(converter_parte(milhoes) + (milhoes === 1 ? " milhão" : " milhões"));
            if (milhares > 0) partes.push(converter_parte(milhares) + " mil");
            if (resto > 0 || partes.length === 0) partes.push(converter_parte(resto));
            let porExtenso = partes.join(", ").replace(/, ([^,]*)$/, " e $1") + (inteiro === 1 ? " real" : " reais");
            if (centavos > 0) porExtenso += " e " + converter_parte(centavos) + (centavos === 1 ? " centavo" : " centavos");
            return porExtenso.charAt(0).toUpperCase() + porExtenso.slice(1);
        }

        function applyFilters() {
            const f = {
                prazo: document.getElementById('f-prazo').value,
                dem: document.getElementById('f-demandante').value,
                mod: document.getElementById('f-modalidade').value,
                fase: document.getElementById('f-fase').value
            };
            const filtered = rawData.filter(i => {
                const aging = getAging(i.data_prevista);
                const matchPrazo = (f.prazo === 'Todos' || (f.prazo === 'Atrasados' && aging.class === 'aging-red') || (f.prazo === 'No Prazo' && aging.class !== 'aging-red'));
                const matchDem = (f.dem === 'Todos' || i.demandante === f.dem);
                const matchMod = (f.mod === 'Todos' || i.modalidade === f.mod);
                const matchFase = (f.fase === 'Todos' || i.fase_atual === f.fase);
                return matchPrazo && matchDem && matchMod && matchFase;
            });
            updateView(filtered);
        }

        function updateView(data) {
            document.getElementById('totalProcessos').innerText = data.length;
            const sumEst = data.reduce((acc, i) => acc + cleanVal(i.vlr_estimado_anual), 0);
            document.getElementById('vlrEstimadoTotal').innerText = formatBRL(sumEst);
            document.getElementById('vlrEstimadoTotal').title = valorPorExtenso(sumEst);
            const atrasados = data.filter(i => getAging(formatDate(i.data_prevista)).class === 'aging-red');
            document.getElementById('totalAtrasados').innerText = atrasados.length;
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = data.map(i => {
                const meta = extractMetaDates(i.observacoes);
                const agingAtiv = getAging(i.data_prevista);
                const agingFinal = getAging(meta.final);
                const timeline = `Entrada: ${formatDate(i.data_entrada)}\nAtividade: ${formatDate(meta.ativ)}\nEntrega Ativ: ${formatDate(i.data_prevista)}\nEntrega Final: ${formatDate(meta.final)}`;
                return `
                <tr class="hover:bg-blue-500/10 transition cursor-pointer" onclick="showDetails('${i.id_processo}')">
                    <td class="px-2 py-4 font-black text-blue-400 truncate text-[10px]">
                        <a href="${i.processo_link}" target="_blank" class="hover:underline" onclick="event.stopPropagation()" title="${timeline}">${i.id_processo}</a>
                    </td>
                    <td class="px-2 py-4">
                        <div class="text-[10px] font-bold text-slate-200 truncate" title="${i.fase_atual}">${i.fase_atual || '-'}</div>
                        <div class="text-[8px] text-amber-400 uppercase font-black truncate">${i.status || '-'}</div>
                    </td>
                    <td class="px-2 py-4 text-center">
                        <span class="aging-badge ${agingAtiv.class} text-[8px]">${agingAtiv.label}</span>
                        <div class="text-[8px] text-slate-500 mt-1">${formatDate(i.data_prevista)}</div>
                    </td>
                    <td class="px-2 py-4 text-center">
                        <span class="text-[10px] font-black ${agingFinal.class === 'aging-red' ? 'text-red-400' : 'text-slate-300'}">${formatDate(meta.final)}</span>
                        <div class="text-[8px] ${agingFinal.class === 'aging-red' ? 'text-red-500/50' : 'text-slate-500'} mt-1 uppercase font-black tracking-tighter">${agingFinal.label}</div>
                    </td>
                    <td class="px-2 py-4 text-right font-black text-slate-300 text-[10px]">${formatBRL(i.vlr_estimado_anual)}</td>
                </tr>
            `}).join('');
        }

        function showDetails(id) {
            const item = rawData.find(x => x.id_processo === id);
            if (!item) return;
            const meta = extractMetaDates(item.observacoes);
            const modal = document.getElementById('modalDetalhes');
            document.getElementById('modalContent').innerHTML = `
                <div class="col-span-2 p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-2 text-blue-400">Objeto</p><p class="font-bold text-slate-100 uppercase tracking-tight">${item.objeto_resumido}</p></div>
                <div class="p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-1">Entrada no Sistema</p><p class="font-black text-white text-lg">${formatDate(item.data_entrada)}</p></div>
                <div class="p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-1">Fase Atual</p><p class="font-black text-amber-400">${item.fase_atual || '-'}</p><p class="text-[10px] italic text-slate-500">Iniciado em: ${formatDate(meta.ativ)}</p></div>
                <div class="p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-1">Prazo da Atividade</p><p class="font-black text-white text-lg">${formatDate(item.data_prevista)}</p><span class="aging-badge ${getAging(item.data_prevista).class}">${getAging(item.data_prevista).label}</span></div>
                <div class="p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-1">Entrega Final Prevista</p><p class="font-black text-emerald-400 text-lg">${formatDate(item.data_prevista)}</p><p class="text-[10px] text-slate-400">${getAging(formatDate(item.data_prevista)).label}</p></div>
                <div class="col-span-2 p-5 bg-slate-900/50 rounded-2xl border border-slate-700"><p class="indicator-label mb-2 text-slate-500">Observações Estratégicas</p><div class="text-xs text-slate-400">${meta.cleanObs || 'Sem notas de acompanhamento.'}</div></div>
            `;
            modal.classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modalDetalhes').classList.add('hidden'); }
        init();
    </script>
</body>
</html>
