<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Licitações | AgSUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/extenso@2.0.1/dist/extenso.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(30, 41, 59, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); color: #f8fafc; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .sla-bar { height: 4px; border-radius: 2px; background: #1e293b; overflow: hidden; margin-top: 4px; }
        .sla-progress { height: 100%; transition: width 0.3s; }
        .sla-on-time { background: #10b981; }
        .sla-warning { background: #f59e0b; }
        .sla-overdue { background: #ef4444; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <header class="max-w-7xl mx-auto mb-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-extrabold uppercase tracking-tight">Gestão de Projetos v2</h1>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-widest">CCS-RD • Licitações 2026</p>
        </div>
        <button onclick="window.location.reload()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Atualizar</button>
    </header>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 glass-card p-6 overflow-hidden">
            <h2 class="text-sm font-bold uppercase mb-4 text-slate-400">Fluxo de Execução</h2>
            <div class="overflow-y-auto max-h-[600px]">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="text-slate-500 border-b border-white/5">
                            <th class="py-3">ID Processo</th>
                            <th class="py-3">Objeto</th>
                            <th class="py-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
        <div class="space-y-6">
            <div class="glass-card p-6">
                <h2 class="text-[10px] font-bold uppercase text-blue-400 mb-4">Volume por Modalidade</h2>
                <canvas id="chartModalidade" height="180"></canvas>
            </div>
            <div class="glass-card p-6">
                <h2 class="text-[10px] font-bold uppercase text-emerald-400 mb-4">Status dos Processos</h2>
                <canvas id="chartStatus" height="180"></canvas>
            </div>
            <div class="glass-card p-6">
                <h2 class="text-[10px] font-bold uppercase text-indigo-400 mb-4">Processos por Responsável</h2>
                <canvas id="chartResponsavel" height="180"></canvas>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qakrpkwmhlpynrphucfl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GO7Aqg_eNO6hqUIl3rAzyg_GRuiIkWE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6366f1'];
        const STATUS_MAP = { 'Devolvido': '#ec4899', 'Em andamento': '#f59e0b', 'Não recebido': '#64748b' };

        async function init() {
            const { data } = await sb.from('licitacoes').select('*');
            if (!data) return;
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = data.map(i => `
                <tr class="border-b border-white/5">
                    <td class="py-4 font-bold text-blue-400">${i.id_processo}</td>
                    <td class="py-4 text-slate-300">${i.objeto_resumido}</td>
                    <td class="py-4 text-center">
                        <span class="status-badge" style="background: ${STATUS_MAP[i.status] || '#1e293b'}30; color: ${STATUS_MAP[i.status] || '#94a3b8'}">${i.status}</span>
                    </td>
                </tr>
            `).join('');

            renderCharts(data);
        }

        function renderCharts(data) {
            const count = (key) => data.reduce((acc, i) => { 
                let v = i[key] || 'N/I';
                if(v === "Cotação de preço") v = "Cotação de Preços";
                acc[v] = (acc[v] || 0) + 1; 
                return acc; 
            }, {});

            draw('chartModalidade', 'doughnut', count('modalidade'));
            draw('chartStatus', 'bar', count('status'), true);
            draw('chartResponsavel', 'bar', count('responsavel'));
        }

        function draw(id, type, dataObj, horizontal = false) {
            new Chart(document.getElementById(id), {
                type: type,
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{ data: Object.values(dataObj), backgroundColor: COLORS, borderRadius: 5 }]
                },
                options: {
                    indexAxis: horizontal ? 'y' : 'x',
                    maintainAspectRatio: false,
                    plugins: { legend: { display: type === 'doughnut', labels: { color: '#94a3b8', font: { size: 8 } } } },
                    scales: { 
                        x: { display: type !== 'doughnut', grid: { display: false }, ticks: { color: '#475569', font: { size: 7 } } },
                        y: { display: type !== 'doughnut', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#475569', font: { size: 7 } } }
                    }
                }
            });
        }
        init();
    </script>
</body>
</html>
